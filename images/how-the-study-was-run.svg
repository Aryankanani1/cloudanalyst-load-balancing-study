<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="708" viewBox="0 0 1000 708" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the CloudAnalyst study was run</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="999" height="707" rx="16" fill="#ffffff" stroke="#e3e6eb"/>

  <!-- title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#0f1b2d">How the study was run</text>
  <text x="40" y="78" font-size="15" fill="#5b6573">Six CloudAnalyst (CloudSim) simulations of a globally distributed web application</text>

  <!-- ============ STEP 1 ============ -->
  <circle cx="53" cy="118" r="13" fill="#b5532a"/>
  <text x="53" y="123" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="124" font-size="17" font-weight="700" fill="#0f1b2d">Model the request path</text>

  <!-- legend -->
  <rect x="766" y="111" width="14" height="14" rx="4" fill="#fdf1ea" stroke="#c0562b"/>
  <text x="786" y="123" font-size="13" fill="#5b6573">What I varied</text>
  <rect x="876" y="111" width="14" height="14" rx="4" fill="#eaf0fd" stroke="#3b5fc8"/>
  <text x="896" y="123" font-size="13" fill="#5b6573">Measured</text>

  <!-- user bases -->
  <rect x="40" y="144" width="200" height="104" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
  <text x="56" y="170" font-size="16" font-weight="700" fill="#0f1b2d">User bases</text>
  <text x="56" y="194" font-size="14" fill="#5b6573">6 regions · UB1–UB6</text>
  <text x="56" y="214" font-size="14" fill="#5b6573">1,000 peak users each</text>
  <text x="56" y="234" font-size="14" fill="#5b6573">60 requests/user/hour</text>

  <line x1="240" y1="196" x2="272" y2="196" stroke="#5b6573" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- internet -->
  <rect x="274" y="144" width="150" height="104" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
  <text x="290" y="170" font-size="16" font-weight="700" fill="#0f1b2d">Internet</text>
  <text x="290" y="194" font-size="14" fill="#5b6573">Network latency</text>
  <text x="290" y="214" font-size="14" fill="#5b6573">between regions</text>

  <line x1="424" y1="196" x2="456" y2="196" stroke="#5b6573" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- service broker -->
  <rect x="458" y="144" width="170" height="104" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
  <text x="474" y="170" font-size="16" font-weight="700" fill="#0f1b2d">Service broker</text>
  <text x="474" y="194" font-size="14" fill="#5b6573">Routes each request</text>
  <text x="474" y="214" font-size="14" fill="#5b6573">to a data center</text>

  <line x1="628" y1="196" x2="660" y2="196" stroke="#5b6573" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- data center -->
  <rect x="662" y="134" width="298" height="120" rx="12" fill="#f6f7f9" stroke="#d9dde3" stroke-dasharray="5 4"/>
  <text x="678" y="157" font-size="15" font-weight="700" fill="#0f1b2d">Data center (DC1–DC4)</text>
  <rect x="678" y="170" width="140" height="68" rx="8" fill="#ffffff" stroke="#d9dde3"/>
  <text x="694" y="197" font-size="14" font-weight="700" fill="#0f1b2d">Load balancer</text>
  <text x="694" y="218" font-size="13" fill="#5b6573">picks a VM</text>
  <line x1="818" y1="204" x2="840" y2="204" stroke="#5b6573" stroke-width="1.6" marker-end="url(#arrow)"/>
  <g fill="#0f1b2d" fill-opacity="0.82">
    <rect x="844" y="174" width="20" height="20" rx="4"/>
    <rect x="870" y="174" width="20" height="20" rx="4"/>
    <rect x="896" y="174" width="20" height="20" rx="4"/>
    <rect x="844" y="200" width="20" height="20" rx="4"/>
    <rect x="870" y="200" width="20" height="20" rx="4"/>
    <rect x="896" y="200" width="20" height="20" rx="4"/>
    <rect x="844" y="226" width="20" height="20" rx="4"/>
    <rect x="870" y="226" width="20" height="20" rx="4" fill-opacity="0.25"/>
    <rect x="896" y="226" width="20" height="20" rx="4" fill-opacity="0.25"/>
  </g>
  <text x="924" y="215" font-size="14" font-weight="700" fill="#0f1b2d">VMs</text>

  <!-- varied knobs -->
  <g stroke="#c0562b" stroke-width="1.4" stroke-dasharray="3 3">
    <line x1="140" y1="248" x2="140" y2="268"/>
    <line x1="748" y1="238" x2="748" y2="268"/>
    <line x1="880" y1="246" x2="880" y2="268"/>
  </g>
  <g font-size="13" font-weight="600" fill="#a8461f" text-anchor="middle">
    <rect x="82" y="268" width="116" height="26" rx="13" fill="#fdf1ea" stroke="#c0562b"/>
    <text x="140" y="286">Request size</text>
    <rect x="712" y="268" width="72" height="26" rx="13" fill="#fdf1ea" stroke="#c0562b"/>
    <text x="748" y="286">Policy</text>
    <rect x="834" y="268" width="92" height="26" rx="13" fill="#fdf1ea" stroke="#c0562b"/>
    <text x="880" y="286">VM count</text>
  </g>

  <!-- measured -->
  <text x="40" y="333" font-size="14" font-weight="700" fill="#0f1b2d">Measured each run:</text>
  <g font-size="13" font-weight="600" fill="#2a4bb0" text-anchor="middle">
    <rect x="182" y="314" width="186" height="28" rx="14" fill="#eaf0fd" stroke="#3b5fc8"/>
    <text x="275" y="333">Avg &amp; max response time</text>
    <rect x="380" y="314" width="196" height="28" rx="14" fill="#eaf0fd" stroke="#3b5fc8"/>
    <text x="478" y="333">Response time per region</text>
    <rect x="588" y="314" width="158" height="28" rx="14" fill="#eaf0fd" stroke="#3b5fc8"/>
    <text x="667" y="333">DC processing time</text>
    <rect x="758" y="314" width="202" height="28" rx="14" fill="#eaf0fd" stroke="#3b5fc8"/>
    <text x="859" y="333">VM + data-transfer cost</text>
  </g>

  <!-- ============ STEP 2 ============ -->
  <circle cx="53" cy="384" r="13" fill="#b5532a"/>
  <text x="53" y="389" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="76" y="390" font-size="17" font-weight="700" fill="#0f1b2d">Run six experiments, changing one thing at a time</text>

  <g>
    <rect x="40" y="408" width="296" height="64" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
    <text x="56" y="435" font-size="15" font-weight="700" fill="#b5532a">01</text>
    <text x="86" y="435" font-size="15" font-weight="700" fill="#0f1b2d">Round Robin baseline</text>
    <text x="86" y="457" font-size="13.5" fill="#5b6573">VMs take turns · 15 / 5 / 5 / 30</text>

    <rect x="352" y="408" width="296" height="64" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
    <text x="368" y="435" font-size="15" font-weight="700" fill="#b5532a">02</text>
    <text x="398" y="435" font-size="15" font-weight="700" fill="#0f1b2d">Throttled</text>
    <text x="398" y="457" font-size="13.5" fill="#5b6573">Caps load per VM · 1 / 1 / 1 / 30</text>

    <rect x="664" y="408" width="296" height="64" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
    <text x="680" y="435" font-size="15" font-weight="700" fill="#b5532a">03</text>
    <text x="710" y="435" font-size="15" font-weight="700" fill="#0f1b2d">Under-provisioned DC</text>
    <text x="710" y="457" font-size="13.5" fill="#5b6573">Same layout, read for the tail</text>

    <rect x="40" y="484" width="296" height="64" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
    <text x="56" y="511" font-size="15" font-weight="700" fill="#b5532a">04</text>
    <text x="86" y="511" font-size="15" font-weight="700" fill="#0f1b2d">One weak data center</text>
    <text x="86" y="533" font-size="13.5" fill="#5b6573">Only DC2 starved · 20 / 1 / 20 / 20</text>

    <rect x="352" y="484" width="296" height="64" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
    <text x="368" y="511" font-size="15" font-weight="700" fill="#b5532a">05</text>
    <text x="398" y="511" font-size="15" font-weight="700" fill="#0f1b2d">Cost-sensitive</text>
    <text x="398" y="533" font-size="13.5" fill="#5b6573">2 user bases send 100× payloads</text>

    <rect x="664" y="484" width="296" height="64" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
    <text x="680" y="511" font-size="15" font-weight="700" fill="#b5532a">06</text>
    <text x="710" y="511" font-size="15" font-weight="700" fill="#0f1b2d">Equally Spread</text>
    <text x="710" y="533" font-size="13.5" fill="#5b6573">Least-busy VM · 7 UBs, 6 DCs</text>
  </g>

  <!-- ============ STEP 3 ============ -->
  <circle cx="53" cy="588" r="13" fill="#b5532a"/>
  <text x="53" y="593" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="76" y="594" font-size="17" font-weight="700" fill="#0f1b2d">Compare the runs side by side</text>

  <g>
    <rect x="40" y="610" width="296" height="72" rx="10" fill="#0f1b2d"/>
    <text x="58" y="642" font-size="22" font-weight="700" fill="#ffffff">92–95 ms</text>
    <text x="58" y="666" font-size="14" fill="#c9d1dc">Network latency sets the average</text>

    <rect x="352" y="610" width="296" height="72" rx="10" fill="#0f1b2d"/>
    <text x="370" y="642" font-size="22" font-weight="700" fill="#ffffff">552.75 ms max</text>
    <text x="370" y="666" font-size="14" fill="#c9d1dc">Under-provisioning sets the tail</text>

    <rect x="664" y="610" width="296" height="72" rx="10" fill="#0f1b2d"/>
    <text x="682" y="642" font-size="22" font-weight="700" fill="#ffffff">$1,157.59</text>
    <text x="682" y="666" font-size="14" fill="#c9d1dc">Payload size sets the cost (7× baseline)</text>
  </g>
</svg>
